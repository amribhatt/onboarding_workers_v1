schema_version: 1
kind: table
id: coa-cascade
description: First hit wins. Decides what happens to one distinct account key; code evaluates it, the model only explains.
hit: first
inputs:
  historic: bool   # the key was mapped and approved before (sponsor store, then Golden store)
  pinned: bool     # the transaction type allows exactly one account, and it is in the chart
  tt_known: bool   # the transaction type is in the transaction type mapping
  score: number    # best text similarity between the source account and the candidate accounts, 0 to 1
outputs:
  tier: {type: string}
  action: {type: enum, values: [apply, suggest, needs_you], unseen: [apply]}
  confidence: {type: number}
rows:
  - id: L0
    when: {historic: true}
    then: {tier: L0 Historic, action: apply, confidence: 0.97}
  - id: L1
    when: {pinned: true}
    then: {tier: L1 Transaction type, action: apply, confidence: 0.85}
  - id: L3
    when: {tt_known: true, score: ">=0.5"}
    then: {tier: L3 Hybrid, action: suggest}
  - id: L4
    when: {tt_known: false, score: ">=0.5"}
    then: {tier: L4 Account, action: suggest}
  - id: L5
    then: {tier: L5 No match, action: needs_you}
