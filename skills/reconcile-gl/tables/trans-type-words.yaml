schema_version: 1
kind: table
id: trans-type-words
description: Words in a Trans Type (matched anywhere, ignoring case) that name a kind of movement. Lists are comma separated.
hit: first
inputs:
  words: string
outputs:
  words_list: {type: csv}
rows:
  - {id: purchase, when: {words: purchase}, then: {words_list: "purchase, buy, acquisition, follow-on"}}
  - {id: proceeds, when: {words: proceeds}, then: {words_list: "return of capital, roc, disposal, sale, sold, proceeds, exit"}}
  - {id: recallable, when: {words: recallable}, then: {words_list: recallable}}
  - {id: none, then: {words_list: "-"}}
