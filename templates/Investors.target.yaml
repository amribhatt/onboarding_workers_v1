# Target rules for Investors. Values equal the former Python constants in worker.templates and worker.sample.
schema_version: 1
kind: target
id: Investors
template: Investors_Upload_Template.xlsx
output: xlsx
name_field: "Investor_Name"
membership:
  types: [Investors]
  static: true
  new_id_always: true
  unique_per_sponsor: true
  existing_store: true
  next: Commitments
controls:
  required: [GP_ID, Investor_ID, Investor_Name]
  key: [Investor_ID]
  id_formats: {max_length: 20, generation: {mode: sequential, prefix: "GINV-", width: 4}, tokens: [PREFIX, SEQ, NAMECODE, YEAR], namecode_length: 4}
  depends: []
  dedup: {exists: exclude, id_conflict: exclude, name_match: exclude}
  checks: []
  levels: {}
