name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      # live-marked tests are excluded by default; no model key is needed or used
      - run: uv run pytest -q --tb=short
      - run: uv run onboarding-worker doctor
        env:
          WORKER_MODEL_PROVIDER: demo
