<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onboarding console</title>
<style>

/* Layout: fixed left nav + main (dashboard, sponsor workspace, job workbench). Light, airy, navy primary. */
:root{

  --ok:#15803d; --ok-bg:#dcfce7; --warn:#8f5206; --warn-bg:#fdecc8; --err:#b42318; --err-bg:#fde4e1; --info:#1d4ed8; --info-bg:#e0e9ff;
  --a:#1e2a78; --b:#c8641e; --c:#b42318; --d:#2e8b46;
  --sans:Inter,system-ui,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --nav:#121828; --card:#171e30; --ink:#eef1f7; --sub:#b4bccb; --faint:#99a4b9; --line:#2a3350;
  --navy:#6f86ff; --navy-ink:#0b1030; --link:#9fb2ff; --tint:#16303a; --tint-line:#2f6270; --sel:#222c4d;
  --ok:#6fd397; --ok-bg:#12301f; --warn:#f0be5a; --warn-bg:#3a2b0d; --err:#ff9a90; --err-bg:#3d1b18; --info:#9fb2ff; --info-bg:#1f2850;
  --a:#6f86ff; --b:#f08a45; --c:#ff6b5e; --d:#4cc27a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --nav:#121828; --card:#171e30; --ink:#eef1f7; --sub:#b4bccb; --faint:#99a4b9; --line:#2a3350;
  --navy:#6f86ff; --navy-ink:#0b1030; --link:#9fb2ff; --tint:#16303a; --tint-line:#2f6270; --sel:#222c4d;
  --ok:#6fd397; --ok-bg:#12301f; --warn:#f0be5a; --warn-bg:#3a2b0d; --err:#ff9a90; --err-bg:#3d1b18; --info:#9fb2ff; --info-bg:#1f2850;
  --a:#6f86ff; --b:#f08a45; --c:#ff6b5e; --d:#4cc27a; color-scheme:dark}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit} button{cursor:pointer}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.side{background:var(--nav);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.main{overflow:auto;padding:22px clamp(16px,3vw,40px) calc(var(--fab,54px) + 16px + 24px);min-width:0}  /* the closed chat launcher (54px, 16px from the edge) never covers the last button */
.page{max-width:1180px;margin:0 auto;display:grid;gap:16px}
@media(max-width:820px){.app{grid-template-columns:1fr;height:auto}.side{flex-direction:row;flex-wrap:wrap}.side .grp{display:none}}
.nav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px}
.nav:hover,.nav.on{background:var(--sel)} .nav.on{font-weight:600}
.nav .c{margin-left:auto;font-size:11.5px;background:var(--line);color:var(--sub);padding:0 7px;border-radius:99px}
.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 10px 3px}
.switch{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:0 1px 2px rgba(17,24,39,.05)}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:600;text-wrap:balance} h2{font-size:16px;margin:0;font-weight:600}
.sub{color:var(--sub)} .faint{color:var(--faint)} .mono{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center} .between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-weight:500;min-height:30px}
.btn:hover{border-color:var(--faint)} .btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.run{background:var(--ok);border-color:var(--ok);color:var(--navy-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed} .btn.sm{padding:2px 9px;font-size:12.5px;min-height:26px}
.lnk{background:none;border:0;color:var(--link);font-weight:500;padding:0}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;min-height:32px}
label.f{display:grid;gap:3px;font-weight:500;font-size:12.5px} label.f small{color:var(--faint);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-err{background:var(--err-bg);color:var(--err)} .p-info{background:var(--info-bg);color:var(--info)} .p-mute{background:var(--line);color:var(--sub)}
.lab{font:600 10px var(--mono);padding:1px 6px;border-radius:4px;margin-left:6px;background:var(--line);color:var(--sub)} .lab.s{background:var(--info-bg);color:var(--info)} .lab.j{background:var(--warn-bg);color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%} th,td{padding:7px 11px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;border-top:0;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums} tr.hov:hover td{background:var(--sel)}
.card>*{min-width:0} .chips{display:flex;flex-wrap:wrap;gap:2px;background:var(--line);border-radius:9px;padding:3px;width:max-content;max-width:100%} .chips button{border:0;background:none;border-radius:7px;padding:4px 10px;color:var(--sub)}
.chips button.on{background:var(--card);color:var(--ink);font-weight:600}
.seg{display:inline-flex;background:var(--line);border-radius:9px;padding:3px} .seg button{border:0;background:none;border-radius:7px;padding:5px 12px;color:var(--sub)} .seg button.on{background:var(--navy);color:var(--navy-ink)}
.note{border-radius:10px;padding:10px 12px;border:1px solid var(--line)} .n-ok{background:var(--ok-bg);border-color:var(--ok)} .n-err{background:var(--err-bg);border-color:var(--err)} .n-warn{background:var(--warn-bg);border-color:var(--warn)} .n-info{background:var(--info-bg);border-color:var(--info)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px} .stat>div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.stat b{display:block;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums} .stat span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;margin:10px 0 12px}.bar i{display:block}
.leg{display:grid;gap:7px} .leg div{display:flex;align-items:center;gap:8px} .leg b{min-width:34px} .leg .pc{margin-left:auto;color:var(--faint)} .dot{width:8px;height:8px;border-radius:50%;flex:none}
.band{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--tint);border:1px solid var(--tint-line)}
.srow{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden} .srow .hd{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px}
.prog{width:90px;height:5px;background:var(--line);border-radius:99px;overflow:hidden} .prog i{display:block;height:100%;background:var(--navy)}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);text-align:left;display:grid;gap:4px;width:100%}
.tile.sel{outline:2px dashed var(--navy);outline-offset:1px} .tile.lock{opacity:.6}
.life{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px;margin-top:12px;overflow-x:auto} .life>div{border-top:3px solid var(--line);padding-top:8px} .life>div.done{border-color:var(--ok)} .life>div.now{border-color:var(--navy)}
.uplo{border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--sub);background:var(--bg)}
.pop{position:absolute;left:0;top:100%;margin-top:6px;width:320px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:10px;z-index:5;display:grid;gap:6px}
.dashbox{border:1.5px dashed var(--tint-line);background:var(--tint);border-radius:10px;padding:10px;text-align:left;width:100%}
/* job screen: the work in the main area, the conversation in a chat docked right (collapsible; a bottom sheet on narrow screens) */
.page.wide{max-width:1480px}
.ws{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start} .ws.x{grid-template-columns:minmax(0,1fr) 48px}
.canvas{display:grid;gap:14px;min-width:0;align-content:start}
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;justify-items:center;gap:2px;text-align:center;padding:2px 4px}
.tl li:not(:last-child)::after{content:"";position:absolute;top:17px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--line)} .tl li.done:not(:last-child)::after{background:var(--ok)}
.tl .d{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--card);border:2px solid var(--line);color:var(--faint)}
.tl .done .d{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .tl .now .d{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)} .tl .stop .d{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.tl b{font-size:12.5px} .tl small{font-size:11.5px;color:var(--faint);line-height:1.3;overflow-wrap:anywhere} .tl .now small{color:var(--link);font-weight:500} .tl .stop small{color:var(--err)}
.fold>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;list-style:none} .fold>summary::-webkit-details-marker{display:none} .fold[open]>summary{margin-bottom:10px}
.flat>.card{border:0;padding:0;box-shadow:none}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 18px;align-items:center} .kv .k{color:var(--faint);font-size:12.5px}
mark{background:var(--warn-bg);color:inherit;border-radius:3px;padding:0 1px} tr.kbsel td{background:var(--sel)}
.toast{position:fixed;top:16px;right:16px;z-index:7;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:10px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;max-width:min(420px,92vw)}
.cop{position:sticky;top:56px;height:calc(100vh - 72px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cop.x{align-items:center;padding:8px 0;height:auto}
.cop-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:12px;display:grid;gap:8px;align-content:start}
.cop-in{border-top:1px solid var(--line);padding:10px;display:grid;gap:6px}
.bub{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card);display:grid;gap:6px;font-size:13px;min-width:0}
.bub.you{background:var(--sel);border-color:var(--sel);justify-self:end;max-width:92%} .bub.done{background:var(--bg)} .bub.done>summary{cursor:pointer;color:var(--sub);font-size:12.5px;display:flex;gap:6px;align-items:center}
@media(max-width:1100px){.ws,.ws.x{grid-template-columns:minmax(0,1fr)}.cop{position:fixed;left:0;right:0;bottom:0;top:auto;height:52vh;border-radius:14px 14px 0 0;z-index:6;box-shadow:0 -8px 30px rgba(0,0,0,.18)}.cop.x{height:auto;flex-direction:row;justify-content:center}.ws:not(.one) .canvas{padding-bottom:52vh}.ws.x .canvas{padding-bottom:60px}.tl small{display:none}}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.5);display:grid;place-items:center;padding:16px;z-index:9} .modal>.card{max-width:640px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:12px}

.sc{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px} .sc th{position:sticky;top:0;background:var(--card);z-index:1}
.chain{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.sr{position:absolute;left:-9999px}
.fl{border:0;background:none;color:var(--faint);opacity:.3;padding:0 4px;font-size:12px;line-height:1;cursor:pointer;vertical-align:middle} .fl:hover,.fl:focus-visible,tr:hover .fl,li:hover .fl,.card:hover>.row .fl{opacity:1;color:var(--err)}

select.switch{width:100%} @media(max-width:820px){.side .nav,.side .seg{display:none}.side select.switch{width:auto;flex:1}} [hidden]{display:none!important}

/* shell: top bar, collapsible navigation, job tabs, issues table, the worker chat as a launcher and an overlay */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabl{padding:8px 14px;color:var(--sub);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabl:hover{color:var(--ink)} .tabl.on{color:var(--ink);border-color:var(--navy);font-weight:600}

@media(max-width:560px){.tabs{flex-wrap:wrap;overflow-x:visible}.tabl{padding:8px 10px}}
.tl-c .tl small{display:none} .tl-c .tl .d{width:22px;height:22px;font-size:11px} .tl-c .tl li:not(:last-child)::after{top:12px;left:calc(50% + 14px);right:calc(-50% + 14px)} .tl-c .tl{margin:0}
.sug{border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:2px 11px;font-size:12.5px;cursor:pointer} .sug:hover{border-color:var(--faint);background:var(--sel)}
.sug .tag{font-size:10.5px;color:var(--link);font-weight:600;margin-left:4px;text-transform:uppercase;letter-spacing:.05em}
.ws.one{grid-template-columns:minmax(0,1fr)}
.cop.ov{position:fixed;right:16px;bottom:16px;top:auto;left:auto;width:min(400px,calc(100vw - 32px));height:min(72vh,680px);z-index:8;box-shadow:0 12px 40px rgba(0,0,0,.28);border-radius:14px}
.cop-fab{position:fixed;right:16px;bottom:16px;z-index:7;width:var(--fab,54px);height:var(--fab,54px);border-radius:50%;padding:0;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.cop-fab svg{width:24px;height:24px}
.cop-fab .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:99px;background:var(--err);color:#fff;font:600 11px var(--sans);display:grid;place-items:center;padding:0 5px}
/* an open floating chat reserves its width, so it never covers the table or its action column */
.ws.ovo .canvas{padding-right:424px}
@media(max-width:1100px){.ws.ovo .canvas{padding-right:0;padding-bottom:min(72vh,680px)}}
@media(max-width:700px){.ws.ovo .canvas{padding-bottom:0}}
@media(max-width:700px){.cop.ov{left:0;right:0;top:0;bottom:0;width:auto;height:auto;border-radius:0}}
.app{grid-template-columns:var(--navw,240px) minmax(0,1fr)}
.tbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;margin:-22px calc(-1*clamp(16px,3vw,40px)) 12px;padding:8px clamp(16px,3vw,40px);background:var(--bg);border-bottom:1px solid var(--line)}
.navtg{display:none}
/* the sticky bar sits at the scroll container's padding edge: no top padding on main, so it pins at 0 and covers nothing */
.main{padding-top:0}.tbar{margin-top:0}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:11}
@media(min-width:821px){.app.nc{--navw:60px}.app.nc .side{padding:14px 8px}.app.nc .nav,.app.nc .switch{font-size:0;justify-content:center;padding:8px 0}.app.nc .nav .c,.app.nc .grp,.app.nc #authNote,.app.nc .switch span,.app.nc .switch svg:last-child{display:none}}
@media(max-width:820px){.app{grid-template-columns:1fr;height:auto}.side{position:fixed;left:0;top:0;bottom:0;width:264px;z-index:12;transform:translateX(-105%);transition:transform .18s;box-shadow:0 8px 30px rgba(0,0,0,.25);flex-direction:column;flex-wrap:nowrap}.side .grp{display:block}.app.no .side{transform:none}.app.no .scrim{display:block}.navtg{display:inline-flex}.navwide{display:none}.main{overflow:visible}.side .nav{display:flex}.side .seg{display:inline-flex}.side select.switch{width:100%;flex:none}}
.canvas>.card{min-width:0} .mact{display:none}
/* a card that is a grid has one column that may shrink: its widest table or chip row scrolls inside, it never widens the page (312 px = a phone at 125%) */
.card{grid-template-columns:minmax(0,1fr)}
.itab td,.itab th{vertical-align:middle;padding:7px 8px} .itab tr.kbsel td{background:var(--sel)}

.src{display:inline-flex;align-items:center;gap:5px;max-width:100%} .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;display:inline-block}

/* the review pane: the group's records first, as many rows as fit; the action bar stays; nothing in it scrolls */
:root{--copw:clamp(440px,34vw,620px)}

.rvp{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
