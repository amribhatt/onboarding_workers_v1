<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--sub:#4b5563;--line:#d7dae1;--navy:#14235b;--err:#b42318;--err-bg:#fde4e1}
@media (prefers-color-scheme:dark){:root{--bg:#0e1320;--card:#171e30;--ink:#eef1f7;--sub:#b4bccb;--line:#2a3350;--navy:#6f86ff;--err:#ff9a90;--err-bg:#3d1b18}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,"Segoe UI",sans-serif}
main{width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:20px} p{margin:0;color:var(--sub)}
label{display:grid;gap:4px;font-size:12.5px;color:var(--sub)}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
button{font:inherit;border:0;border-radius:8px;padding:10px;background:var(--navy);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
a{color:var(--navy)} #err{display:none;background:var(--err-bg);color:var(--err);border-radius:8px;padding:8px 10px;font-size:13px}
</style></head><body>
<main>
  <h1 id="title">Sign in</h1>
  <p id="lead">Use your email and your password.</p>
  <div id="err" role="alert"></div>
  <form id="f" autocomplete="on" style="display:grid;gap:12px">
    <label id="nameRow" hidden>Full name<input id="name" autocomplete="name" maxlength="40"></label>
    <label id="emailRow" hidden>Email<input id="email" type="email" autocomplete="email" maxlength="120"></label>
    <label id="loginRow">Email<input id="login" type="email" autocomplete="username" maxlength="120"></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" maxlength="200"></label>
    <button id="go" type="submit">Sign in</button>
  </form>
  <p id="swap"></p>
</main>
<script>
"use strict";
const reg = location.pathname === "/register", $ = (i) => document.getElementById(i);
$("title").textContent = reg ? "Create your account" : "Sign in";
$("lead").textContent = reg ? "Your full name, an email and a password. You sign in with your email and password." : "Use your email and your password.";
$("go").textContent = reg ? "Register" : "Sign in";
for (const id of ["nameRow", "emailRow"]) $(id).hidden = !reg;
$("loginRow").hidden = reg;
$("password").autocomplete = reg ? "new-password" : "current-password";
$("swap").innerHTML = reg ? 'Already registered? <a href="/login">Sign in</a>' : 'New here? <a href="/register">Create an account</a>';
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").style.display = "none"; $("go").disabled = true;
  const body = reg ? { name: $("name").value, email: $("email").value, password: $("password").value }
                   : { login: $("login").value, password: $("password").value };
  try {
    const r = await fetch(reg ? "/api/auth/register" : "/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || d.error || "Something went wrong.");
    location.href = "/console";
  } catch (x) { $("err").textContent = x.message; $("err").style.display = "block"; $("go").disabled = false; }
});
</script></body></html>
