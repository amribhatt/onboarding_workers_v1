<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in or sign up</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--sub:#4b5563;--line:#d7dae1;--navy:#14235b;--err:#b42318;--err-bg:#fde4e1}
@media (prefers-color-scheme:dark){:root{--bg:#0e1320;--card:#171e30;--ink:#eef1f7;--sub:#b4bccb;--line:#2a3350;--navy:#6f86ff;--err:#ff9a90;--err-bg:#3d1b18}}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,"Segoe UI",sans-serif}
main{width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:20px} p{margin:0;color:var(--sub)}
label{display:grid;gap:4px;font-size:12.5px;color:var(--sub)}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
button{font:inherit;border:0;border-radius:8px;padding:10px;background:var(--navy);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{background:transparent;color:var(--sub);border-radius:0;padding:9px}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff}
a{color:var(--navy)} #err{display:none;background:var(--err-bg);color:var(--err);border-radius:8px;padding:8px 10px;font-size:13px}
</style></head><body>
<main>
  <h1>Onboarding Worker</h1>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabIn">Sign in</button>
    <button type="button" role="tab" id="tabUp">Sign up</button>
  </div>
  <p id="lead"></p>
  <div id="err" role="alert"></div>
  <form id="f" autocomplete="on" style="display:grid;gap:12px">
    <label id="nameRow" hidden>Full name<input id="name" autocomplete="name" maxlength="40"></label>
    <label>Email<input id="email" type="email" autocomplete="username" maxlength="120" required></label>
    <label id="codeRow" hidden>One-time code<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="20"></label>
    <label id="pwLabel">Password<input id="password" type="password" autocomplete="current-password" maxlength="200" required></label>
    <button id="go" type="submit">Sign in</button>
  </form>
  <p id="forgotRow"><a href="#" id="forgot">Forgot password?</a></p>
  <p id="backRow" hidden><a href="#" id="back">Back to sign in</a></p>
</main>
<script>
"use strict";
const $ = (i) => document.getElementById(i);
let up = location.pathname === "/register", mode = "in", step = 1;  // mode: in | up | forgot
function show() {
  const f = mode === "forgot", s2 = f && step === 2;
  $("tabIn").setAttribute("aria-selected", String(mode === "in")); $("tabUp").setAttribute("aria-selected", String(mode === "up"));
  $("nameRow").hidden = mode !== "up"; $("name").required = mode === "up";
  $("pwLabel").hidden = f && step === 1; $("password").required = mode !== "forgot" || s2;
  $("codeRow").hidden = !s2; $("code").required = s2;
  $("forgotRow").hidden = mode !== "in"; $("backRow").hidden = !f;
  $("lead").textContent = mode === "up" ? "Enter your full name, your email and choose a password (at least 8 characters)."
    : mode === "in" ? "Use the email and password you chose when you signed up."
    : s2 ? "Enter the code we sent and choose a new password (at least 8 characters)."
         : "Enter your email and we will send you a one-time code.";
  $("pwLabel").firstChild.textContent = mode === "up" ? "Choose a password" : f ? "New password" : "Password";
  $("password").autocomplete = mode === "in" ? "current-password" : "new-password";
  $("go").textContent = mode === "up" ? "Sign up" : mode === "in" ? "Sign in" : s2 ? "Change password" : "Send code";
  $("err").style.display = "none";
  history.replaceState(null, "", mode === "up" ? "/register" : "/login");
}
const go = (m) => (e) => { e && e.preventDefault(); mode = m; step = 1; show(); };
$("tabIn").onclick = go("in"); $("tabUp").onclick = go("up"); $("forgot").onclick = go("forgot"); $("back").onclick = go("in");
mode = up ? "up" : "in"; show();
function fail(msg) { $("err").textContent = msg; $("err").style.display = "block"; $("go").disabled = false; }
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").style.display = "none"; $("go").disabled = true;
  const post = async (url, body) => {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || d.error || "Something went wrong.");
    return d;
  };
  try {
    if (mode === "forgot" && step === 1) {
      const d = await post("/api/auth/forgot", { email: $("email").value });
      step = 2; show(); $("lead").textContent = d.message + " Enter it below with a new password.";
      $("go").disabled = false; return;
    }
    if (mode === "forgot") {
      await post("/api/auth/reset", { email: $("email").value, code: $("code").value, password: $("password").value });
      $("code").value = ""; $("password").value = ""; mode = "in"; step = 1; show();
      $("lead").textContent = "Password changed. Sign in with your new password.";
      $("go").disabled = false; return;
    }
    await post(mode === "up" ? "/api/auth/register" : "/api/auth/login",
      mode === "up" ? { name: $("name").value, email: $("email").value, password: $("password").value }
                    : { login: $("email").value, password: $("password").value });
    location.href = "/console";
  } catch (x) { fail(x.message); }
});
</script></body></html>
